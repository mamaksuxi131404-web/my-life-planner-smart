<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY Life Planner SMART</title><style>:root{font-family:Arial,sans-serif;--bg:#f3eee7;--card:#fffaf5;--ink:#332d29;--accent:#7b8050;--border:#e5dbce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}body.graphite{--bg:#181d24;--card:#262d36;--ink:#f1f2f5;--accent:#749dd5;--border:#46505d}body.pure{--bg:#f4f5f7;--card:white;--ink:#232b34;--accent:#303c48;--border:#dce0e5}main{max-width:480px;min-height:100vh;margin:auto;padding:25px 18px 100px}h1{font:normal 30px Georgia,serif}h2{font-size:18px}.brand{text-align:center;font:26px Georgia,serif;margin:35px 0}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin:15px 0;box-shadow:0 8px 24px #0000000b}.muted,small{opacity:.65}.btn{border:0;border-radius:25px;background:var(--accent);color:white;padding:13px 19px;font-weight:bold;cursor:pointer}.wide{width:100%}.line{border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:13px;padding:13px;width:100%;margin:5px 0;text-align:left}.selected{outline:2px solid var(--accent)}input,select,textarea{font:inherit}input[type=text],input[type=date],input[type=time],select,textarea{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--ink);width:100%;margin:7px 0 13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.task{padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}.task label{flex:1}.task.done label{text-decoration:line-through;opacity:.55}.task button{border:0;background:none;color:var(--accent);font-size:22px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--border);padding:12px 4px 20px}.nav button{background let stored={};try{stored=JSON.parse(localStorage.getItem('my-life-planner-smart-v1')||'{}')}catch(err){console.warn('Storage unavailable',err)}let s={step:0,lang:'ru',theme:'soft',categories:[],tasks:[],notes:[],tab:'home',date:new Date().toLocaleDateString('sv-SE'),...stored};const tr=i=>(labels[s.lang]||labels.en)[i]||labels.en[i];const save=()=>(()=>{try{localStorage.setItem('my-life-planner-smart-v1',JSON.stringify(s))}catch(err){console.warn('Cannot persist in file preview',err)}})();const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');function set(k,v){s[k]=v;save();render()}function next(){set('step',s.step+1)}function themes(){return '<div class="themes">'+['soft','graphite','pure'].map((x,i)=>`<button class="line ${s.theme===x?'selected':''}" onclick="set('theme','${x}')"><div style="height:40px;border-radius:8px;background:${['#e4d4be','#252b35','#fafafa'][i]};border:1px solid #aaa;margin-bottom:8px"></div>${x.toUpperCase()}</button>`).join('')+'</div>'}function onboard(){if(s.step===0)return `<div class="brand">❧<br>MY Life Planner<br>SMART</div><div class="card" style="height:230px;background:linear-gradient(155deg,#f8ead8,#b3b18e,#6e8069);display:grid;place-items:center;color:white;font:28px Georgia,serif">✧</div><p style="text-align:center">Один планер. Разные жизни. Твой ритм.</p><button class="btn wide" onclick="next()">${tr(0)} →</button>`;if(s.step===1)return `<h1>${tr(1)}</h1>${languages.map(([k,n])=>`<button class="line ${s.lang===k?'selected':''}" onclick="set('lang','${k}')">${n}</button>`).join('')}<button class="btn wide" onclick="next()">${tr(2)} →</button>`;if(s.step===2)return `<h1>${tr(3)}</h1><p class="muted">✓</p>${[4,5,6,7,8,9].map(i=>`<button class="line ${s.categories.includes(i)?'selected':''}" onclick="category(${i})">${['🎓','💼','⌂','🌱','◉','♡'][i-4]} ${tr(i)}</button>`).join('')}<button class="btn wide" onclick="next()">${tr(2)} →</button>`;return `<h1>${tr(10)}</h1>${themes()}<p class="muted">SOFT · GRAPHITE · PURE</p><button class="btn wide" onclick="next()">${tr(2)} →</button>`}function category(i){s.categories=s.categories.includes(i)?s.categories.filter(x=>x!==i):[...s.categories,i];save();render()}
function taskList(arr){return arr.length?arr.map(x=>`<div class="task ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggle('${x.id}')"><label>${safe(x.title)}<br><small>${safe(x.date)} ${safe(x.time)}</small></label><button onclick="remove('${x.id}')" aria-label="${tr(34)}">×</button></div>`).join(''):`<p class="muted">${tr(25)}</p>`}function home(){let tasks=s.tasks.filter(x=>x.date===s.date);let upcoming=s.tasks.filter(x=>!x.done&&x.date>=dateKey(new Date())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];return `<h1>${tr(11)} ♡</h1><p class="muted">${new Intl.DateTimeFormat(s.lang,{weekday:'long',day:'numeric',month:'long'}).format(new Date(s.date+'T12:00'))}</p><input type="date" value="${s.date}" onchange="set('date',this.value)"><div class="card"><h2>◷ ${tr(17)}</h2>${upcoming?`<b>${safe(upcoming.title)}</b><p class="muted">${safe(upcoming.date)} ${safe(upcoming.time)}</p>`:`<p class="muted">${tr(25)}</p>`}</div><div class="card"><div class="row"><h2>✓ ${tr(18)}</h2><small>${tasks.filter(x=>x.done).length}/${tasks.length}</small></div>${taskList(tasks.slice(0,5))}<button class="line" onclick="taskModal()">＋ ${tr(16)}</button></div>`}function calendar(){let d=new Date(s.date+'T12:00'),first=new Date(d.getFullYear(),d.getMonth(),1),count=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),offset=(first.getDay()+6)%7;return `<h1>${tr(13)}</h1><div class="row"><button class="line" style="width:auto" onclick="month(-1)">‹</button><b>${new Intl.DateTimeFormat(s.lang,{month:'long',year:'numeric'}).format(d)}</b><button class="line" style="width:auto" onclick="month(1)">›</button></div><div class="card calendar">${Array(offset).fill('<span></span>').join('')}${Array.from({length:count},(_,i)=>{let day=new Date(d.getFullYear(),d.getMonth(),i+1),key=dateKey(day);return `<button class="${key===s.date?'selected':''}" onclick="set('date','${key}')">${i+1}${s.tasks.some(t=>t.date===key)?'•':''}</button>`}).join('')}</div><div class="card"><h2>${s.date}</h2>${taskList(s.tasks.filter(x=>x.date===s.date))}</div>`}function month(n){let d=new Date(s.date+'T12:00');d.setDate(1);d.setMonth(d.getMonth()+n);set('date',dateKey(d))}function tasks(){return `<h1>${tr(26)}</h1><button class="btn wide" onclick="taskModal()">＋ ${tr(16)}</button><div class="card">${taskList([...s.tasks].sort((a,b)=>a.date.localeCompare(b.date)))}</div>`}function notes(){return `<h1>${tr(27)}</h1><button class="btn wide" onclick="noteModal()">＋ ${tr(28)}</button>${s.notes.map(n=>`<div class="card"><div class="row"><b>${safe(n.title)}</b><button class="line" style="width:auto" onclick="deleteNote('${n.id}')">×</button></div><p style="white-space:pre-wrap">${safe(n.text)}</p></div>`).join('')}`}function settings(){return `<h1>${tr(15)}</h1><div class="card"><h2>${tr(29)}</h2><select onchange="set('lang',this.value)">${languages.map(([k,n])=>`<option value="${k}" ${k===s.lang?'selected':''}>${n}</option>`).join('')}</select></div><div class="card"><h2>${tr(30)}</h2>${themes()}</div><div class="card"><h2>${tr(32)}</h2><p>${tr(33)}: ${s.tasks.filter(x=>x.done).length}/${s.tasks.length}</p></div><button class="line" onclick="set('step',0)">${tr(31)}</button><p class="muted">Prototype v0.1 · Data stored only in this browser</p>`}function render(){document.body.className=s.theme;document.documentElement.lang=s.lang;document.getElementById('app').innerHTML=s.step<4?onboard():`<div style="text-align:center;font:18px Georgia,serif;margin-bottom:24px">MY Life Planner <b>SMART</b></div>${({home,calendar,tasks,notes,settings}[s.tab]||home)()}<nav class="nav">${[['home','⌂',12],['calendar','▦',13],['tasks','☑',14],['notes','✎',27],['settings','⚙',15]].map(([k,icon,i])=>`<button class="${s.tab===k?'active':''}" onclick="set('tab','${k}')">${icon}<br>${tr(i)}</button>`).join('')}</nav>`}function toggle(id){let x=s.tasks.find(x=>x.id===id);x.done=!x.done;save();render()}function remove(id){s.tasks=s.tasks.filter(x=>x.id!==id);save();render()}function deleteNote(id){s.notes=s.notes.filter(x=>x.id!==id);save();render()}function closeModal(){document.getElementById('modal').innerHTML=''}function taskModal(){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this )closeModal()"><form class="sheet" novalidate onsubmit="return addTask(event)"><div class="row"><h2>${tr(19)}</h2><button type="button" class="line" style="width:auto" onclick="closeModal()">×</button></div><label>${tr(20)}</label><input name="title" type="text" required maxlength="160"><label>${tr(21)}</label><input name="date" type="date" value="${s.date}" required><label>${tr(22)}</label><input name="time" type="time"><div id="task-error" style="color:#b44;font-size:13px;margin:8px 0" role="alert"></div><button type="button" class="btn wide" onclick="addTaskFromButton(this)">${tr(23)}</button></form></div>`}function addTaskFromButton(btn){const form=btn.closest('form');const title=(form.querySelector('input[name="title"]')?.value||'').trim();const date=form.querySelector('input[name="date"]')?.value||s.date;const time=form.querySelector('input[name="time"]')?.value||'';const err=form.querySelector('#task-error');if(!title){err.textContent=s.lang==='ru'?'Введите название задачи':s.lang==='ko'?'할 일 제목을 입력하세요':'Enter a task title';return}if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent=s.lang==='ru'?'Выберите дату':'Choose a date';return}try{s.tasks.push({id:String(Date.now())+Math.random().toString(36).slice(2),title,date,time,done:false});save();closeModal();s.tab='tasks';render()}catch(e){err.textContent='Error: '+e.message}}function addTask(e){e.preventDefault();addTaskFromButton(e.currentTarget.querySelector('button.btn'));return false}function noteModal(){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this )closeModal()"><form class="sheet" onsubmit="return addNote(event)"><h2>${tr(28)}</h2><input name="title" type="text" placeholder="${tr(20)}" required><textarea name="text" rows="5"></textarea><div id="task-error" style="color:#b44;font-size:13px;margin:8px 0" role="alert"></div><button type="button" class="btn wide" onclick="addTaskFromButton(this)">${tr(23)}</button></form></div>`}function addNote(e){e.preventDefault();let f=new FormData(e.target);s.notes.unshift({id:String(Date.now()),title:f.get('title'),text:f.get('text')});save();closeModal();render()}render();</script></html>
